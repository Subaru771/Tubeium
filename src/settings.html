<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Tubeium — Settings</title>
<link rel="stylesheet" href="settings.css">
</head>
<body data-theme="dark">
<div class="app-shell">
  <aside class="sidebar" aria-label="Settings navigation">
    <div class="brand"><span class="brand-mark" aria-hidden="true">▶</span><div class="brand-copy"><strong>Tubeium</strong><small>SETTINGS</small></div><span class="brand-version">1.0.11</span></div>
    <p class="sidebar-label">PREFERENCES</p>
    <nav id="navigation" aria-label="Settings categories"></nav>
    <div class="sidebar-bottom">
      <button id="go-player" type="button" class="sidebar-action">↗ <span>Back to YouTube</span></button>
      <button id="open-download-folder" type="button" class="sidebar-action">↓ <span>Open downloads folder</span></button>
    </div>
  </aside>
  <div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-label="Resize settings sidebar" aria-orientation="vertical" aria-valuemin="205" aria-valuemax="480" aria-valuenow="249" tabindex="0"></div>
  <main class="main">
    <header class="topbar">
      <span class="breadcrumb">TUBEIUM <span>/</span> <strong id="crumb-name">General</strong></span>
      <label class="global-search" for="global-search"><span aria-hidden="true">⌕</span><input id="global-search" type="search" placeholder="Search settings" aria-label="Search Tubeium settings" autocomplete="off"><kbd>Ctrl K</kbd></label>
      <button id="go-downloads" type="button" class="top-button">↓ <span>Downloads</span></button>
      <details class="tools-menu">
        <summary aria-label="More settings actions" title="More settings actions">⋯</summary>
        <div class="tools-panel">
          <div class="tools-caption">TOOLS</div>
          <button id="import" type="button">Import settings</button>
          <button id="export" type="button">Export settings</button>
          <button id="backup-all" type="button">Back up data</button>
          <button id="restore-all" type="button">Restore backup</button>
          <button id="check-updates" type="button">Check for updates</button>
          <div class="tools-divider"></div>
          <button id="clear-cache" type="button">Clear cache</button>
          <button id="clear-cookies" type="button" class="danger">Clear sign-in cookies</button>
          <button id="reset-all" type="button" class="danger">Reset all settings</button>
        </div>
      </details>
    </header>
    <div id="scroll-area" class="scroll-area">
      <div class="content">
        <header class="section-heading">
          <div><p class="eyebrow">YOUR PREFERENCES</p><h1 id="category-heading">General</h1><p id="category-description">Simple, useful controls.</p></div>
          <button id="reset-section" type="button" class="reset-button">Reset this section</button>
        </header>
        <div id="advanced-topics" class="advanced-topics" aria-label="Advanced settings categories" hidden></div>
        <div id="settings-list" class="settings-list" aria-live="polite"></div>
        <div class="settings-footer">
          <span>Changes are saved automatically. Advanced settings are grouped in their own sidebar tab.</span>
        </div>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="settings-sidebar-resize.js"></script>
<script src="touch-mode.js"></script><script src="settings-renderer.js"></script>
</body>
</html>
