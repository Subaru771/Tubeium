name: Publish Tubeium v1.0.9 verified Windows binaries
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v109-once.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-tubeium-v109-verified-once
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.0.9
      SOURCE_RUN: '42584995441'
      SOURCE_SHA: 1095a29a6d8516c03408926b08e00c175b701b47
    steps:
      - name: Check out verified 1.09 source from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release source and original Windows build
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = '1.0.9'
          test -s docs/releases/v1.0.9.md
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .status)" = completed
          status=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --silent --include 2>/dev/null | head -1 || true)
          if [[ "$status" == *"200"* ]]; then echo "Refusing to overwrite existing tag"; exit 1; fi
      - name: Download exact verified Windows build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-publish
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name Tubeium-Windows-unsigned --dir dist-publish
      - name: Check SHA256 and expected Windows binary sizes
        shell: bash
        run: |
          set -euo pipefail
          cd dist-publish
          test "$(stat -c %s Tubeium-1.0.9-Setup-x64.exe)" -gt 10000000
          test "$(stat -c %s Tubeium-1.0.9-Portable-x64.exe)" -gt 10000000
          sha256sum --check SHA256SUMS.txt
      - name: Publish official unsigned v1.0.9 GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist-publish/Tubeium-1.0.9-Setup-x64.exe \
            dist-publish/Tubeium-1.0.9-Portable-x64.exe \
            dist-publish/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Tubeium 1.09 (unsigned)" --notes-file docs/releases/v1.0.9.md
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets|length')" = 3
