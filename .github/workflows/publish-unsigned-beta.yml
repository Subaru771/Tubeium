name: Publish unsigned Windows release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New release tag matching package.json (for example v1.0.1)'
        required: true
        type: string
  # One-time publication request for the reviewed Tubeium 1.08 release.
  push:
    branches: [main]
    paths:
      - '.github/release-requests/v1.0.8.txt'
permissions:
  contents: write
concurrency:
  group: tubeium-unsigned-release-${{ github.event_name == 'push' && 'v1.0.8' || inputs.release_tag }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate requested tag, version and main branch
        env:
          TUBEIUM_RELEASE_TAG: ${{ github.event_name == 'push' && 'v1.0.8' || inputs.release_tag }}
        run: node scripts/validate-unsigned-release.js
      - name: Refuse to overwrite an existing Git tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TUBEIUM_RELEASE_TAG: ${{ github.event_name == 'push' && 'v1.0.8' || inputs.release_tag }}
        run: |
          # Authenticated lookup works even when checkout has persist-credentials: false.
          # Treat only 404 as tag-not-found. All other API failures block publishing.
          $url = "https://api.github.com/repos/$env:GH_REPO/git/ref/tags/$env:TUBEIUM_RELEASE_TAG"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $response = Invoke-WebRequest -Uri $url -Headers $headers -SkipHttpErrorCheck -ErrorAction Stop
          if ($response.StatusCode -eq 200) { throw "Tag $env:TUBEIUM_RELEASE_TAG already exists. Refusing to overwrite." }
          if ($response.StatusCode -ne 404) { throw "Could not verify remote tags (HTTP $($response.StatusCode)). Refusing to publish." }
      - name: Verify committed dependency lock
        run: npm run verify:dependencies
      - name: Install locked dependencies (retry temporary FFmpeg download errors)
        shell: pwsh
        run: |
          for ($attempt=1; $attempt -le 3; $attempt++) {
            # ffmpeg-static supports this documented mirror. Only use it
            # when its original release host has failed.
            if ($attempt -gt 1) {
              $env:FFMPEG_BINARIES_URL = 'https://cdn.npmmirror.com/binaries/ffmpeg-static'
            }
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "npm ci failed after three attempts" }
            Start-Sleep -Seconds (5 * $attempt)
          }
      - name: Run source and release safety checks
        run: npm run verify:release
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build Windows installer (retry transient release host 504)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for ($attempt=1; $attempt -le 3; $attempt++) {
            if ($attempt -gt 1) {
              # Electron/Builder official documented mirror options are
              # only used after GitHub's original release hosts time out.
              $env:ELECTRON_MIRROR = 'https://npmmirror.com/mirrors/electron/'
              $env:ELECTRON_BUILDER_BINARIES_MIRROR = 'https://npmmirror.com/mirrors/electron-builder-binaries/'
            }
            npm run build:installer
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "installer packaging failed after three attempts" }
            Start-Sleep -Seconds (5 * $attempt)
          }
      - name: Build Windows portable (retry transient release host 504)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for ($attempt=1; $attempt -le 3; $attempt++) {
            if ($attempt -gt 1) {
              # Electron/Builder official documented mirror options are
              # only used after GitHub's original release hosts time out.
              $env:ELECTRON_MIRROR = 'https://npmmirror.com/mirrors/electron/'
              $env:ELECTRON_BUILDER_BINARIES_MIRROR = 'https://npmmirror.com/mirrors/electron-builder-binaries/'
            }
            npm run build:portable
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "portable packaging failed after three attempts" }
            Start-Sleep -Seconds (5 * $attempt)
          }
      - name: Verify both binaries and generate SHA-256 checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $files = @("dist/Tubeium-$version-Setup-x64.exe", "dist/Tubeium-$version-Portable-x64.exe")
          foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "Missing: $file" }
            if ((Get-Item $file).Length -lt 10MB) { throw "Unexpectedly small binary: $file" }
          }
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash $file -Algorithm SHA256
            "$($hash.Hash.ToLower())  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      # Development artifacts are optional when Actions storage quota is full.
      # Release assets are published directly to GitHub Releases separately.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: Tubeium-unsigned-${{ github.event_name == 'push' && 'v1.0.8' || inputs.release_tag }}
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish a NEW public unsigned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TUBEIUM_RELEASE_TAG: ${{ github.event_name == 'push' && 'v1.0.8' || inputs.release_tag }}
        run: |
          $tag = $env:TUBEIUM_RELEASE_TAG
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "dist/Tubeium-$version-Setup-x64.exe"
          $portable = "dist/Tubeium-$version-Portable-x64.exe"
          $notes = @"
          Tubeium $tag for Windows.

          **Unsigned release:** Windows SmartScreen may warn. Only download from the official Tubeium GitHub Releases page.
          Automated source tests, dependency audits and packaging checks passed. Live Google sign-in is not guaranteed.
          Includes Windows installer, portable EXE and SHA256SUMS.txt for integrity verification.
          "@
          if ($tag -eq 'v1.0.8') {
            $title = 'Tubeium 1.08'
            $notes = Get-Content 'docs/releases/v1.0.8.md' -Raw
          } else {
            $title = "Tubeium $tag (unsigned)"
          }
          gh release create "$tag" "$installer" "$portable" "dist/SHA256SUMS.txt" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "$title" --notes "$notes"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publishing failed.' }
